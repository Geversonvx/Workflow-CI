name: MLflow CI Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Setup Python (STABIL)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # 3. Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r MLProject/requirements.txt

      # 4. Run MLflow Project
      - name: Run MLflow Project
        working-directory: MLProject
        run: |
          mlflow run . --env-manager=local -P data_path=heart_preprocessing/heart_preprocessed.csv

      # 5. Commit mlruns to repository
      - name: Commit mlruns folder
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git add MLProject/mlruns || echo "No mlruns to add"
          git commit -m "Add MLflow Project training artifacts" || echo "No changes to commit"
          git push
