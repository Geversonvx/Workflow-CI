name: MLflow CI with Docker

on:
  push:
    branches: [ main ]

jobs:
  train-and-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install mlflow scikit-learn

    # =========================
    # 1. TRAIN MODEL (MLflow)
    # =========================
    - name: Run MLflow Project
      run: |
        mlflow run MLProject --env-manager=local

    # =========================
    # 2. LOGIN DOCKER HUB
    # =========================
    - name: Login to Docker Hub
      run: |
        echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login \
          -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

    # =========================
    # 3. BUILD DOCKER IMAGE
    # =========================
    - name: Build Docker image from MLflow model
      run: |
        MODEL_PATH=$(ls -d MLProject/mlruns/0/models/*/artifacts | head -n 1)
        mlflow models build-docker \
          -m $MODEL_PATH \
          -n ${{ secrets.DOCKERHUB_USERNAME }}/creditcard-mlflow-model

    # =========================
    # 4. PUSH DOCKER IMAGE
    # =========================
    - name: Push Docker image
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/creditcard-mlflow-model
